name: Probe KDE Qt5 Android Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kde-qt5.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recover retired KDE Qt5 Android definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          BASE = "https://invent.kde.org/api/v4"

          def get_json(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return json.load(r)

          def get_bytes(url):
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return r.read()
              except Exception:
                  return None

          def commits(project, path):
              p = urllib.parse.quote(project, safe="")
              q = urllib.parse.urlencode({"path": path, "per_page": 100})
              return get_json(f"{BASE}/projects/{p}/repository/commits?{q}")

          def raw(project, path, ref):
              p = urllib.parse.quote(project, safe="")
              f = urllib.parse.quote(path, safe="")
              q = urllib.parse.urlencode({"ref": ref})
              return get_bytes(f"{BASE}/projects/{p}/repository/files/{f}/raw?{q}")

          targets = [
              ("sysadmin/ci-utilities", "gitlab-templates/craft-android-apks.yml"),
              ("sysadmin/ci-utilities", "gitlab-templates/craft-android-appbundle.yml"),
              ("sysadmin/ci-images", "android-qt515/Dockerfile"),
              ("sysadmin/ci-images", "android-qt515/build.sh"),
              ("sysadmin/ci-images", "android-qt515/setup-environment.sh"),
              ("sysadmin/ci-images", "android-qt515/setup-sdk-qt.sh"),
              ("sysadmin/ci-images", "android-qt515/sysprep.sh"),
          ]

          for project, path in targets:
              print("\n" + "="*80)
              print(project, path)
              cs = commits(project, path)
              print("COMMITS:")
              for c in cs[:20]:
                  print(c["id"], c.get("created_at"), c.get("title"))
              found = None
              for c in cs:
                  data = raw(project, path, c["id"])
                  if data:
                      found = (c, data)
                      break
                  for parent in c.get("parent_ids", []):
                      data = raw(project, path, parent)
                      if data:
                          found = ({"id": parent, "title": "parent of " + c.get("title","")}, data)
                          break
                  if found:
                      break
              if found:
                  c, data = found
                  print("RECOVERED_REF:", c["id"], c.get("title"))
                  print(data.decode("utf-8", errors="replace"))
              else:
                  print("NO_HISTORICAL_FILE_RECOVERED")
          PY
