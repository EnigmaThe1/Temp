name: Probe KDE Qt5 Android Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kde-qt5.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect current Krita Android SDK image
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE=invent-registry.kde.org/sysadmin/ci-images/krita-android-sdk36-2204:latest
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" bash -lc '
            echo "=== identity ==="
            id
            echo "=== Qt ==="
            command -v qmake || true
            qmake -v || true
            command -v qmake-qt5 || true
            qmake-qt5 -v || true
            command -v qtpaths || true
            qtpaths --qt-version || true
            echo "=== Android ==="
            env | grep -E "ANDROID|NDK|SDK|JAVA|QT" | sort || true
            find /opt -maxdepth 4 -type f \( -name qmake -o -name qt.toolchain.cmake -o -name androiddeployqt \) -print 2>/dev/null | head -100
            echo "=== Craft ==="
            find /home /opt -maxdepth 4 -type f -name craftenv.sh -o -name CraftSettings.ini 2>/dev/null | head -100
          '
