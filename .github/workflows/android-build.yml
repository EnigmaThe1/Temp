name: Disposable Android Build

on:
  push:
    branches:
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Temp payload
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare disposable OmniCouncil workspace
        run: |
          git clone --depth 1 --branch tmp-omnicouncil-build https://github.com/EnigmaThe1/autonomous-factory-platform.git /tmp/base
          cp -a /tmp/base/llm-council-mobile/. /tmp/omnicouncil/
          cp payload/app-build.gradle /tmp/omnicouncil/app/build.gradle
          cp payload/GitHubClient.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/GitHubClient.kt
          cp payload/OpenRouterClient.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/OpenRouterClient.kt
          cp payload/AuditModels.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/model/AuditModels.kt
          cp payload/RepoAuditViewModel.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/RepoAuditViewModel.kt
          cp payload/RepoAuditActivity.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/RepoAuditActivity.kt
          python - <<'PY'
          from pathlib import Path
          gh = Path('/tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/GitHubClient.kt')
          s = gh.read_text()
          s = s.replace('List<TreeMeta>=buildList', 'List<TreeMeta> = buildList')
          gh.write_text(s)
          ui = Path('/tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/RepoAuditActivity.kt')
          s = ui.read_text()
          fixes = {
            'if(a.complete)"✓"else""': 'if (a.complete) "✓" else ""',
            'if(full)"Collapse report"else"Show full report"': 'if (full) "Collapse report" else "Show full report"',
            'if(expanded)"Hide peer reviews"else"Show peer reviews"': 'if (expanded) "Hide peer reviews" else "Show peer reviews"',
            'if(full)"Collapse final report"else"Show full final report"': 'if (full) "Collapse final report" else "Show full final report"',
          }
          for a,b in fixes.items(): s=s.replace(a,b)
          ui.write_text(s)
          PY
      - name: Build unsigned release APK
        working-directory: /tmp/omnicouncil
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCouncil-v5.3-unsigned
          path: /tmp/omnicouncil/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
