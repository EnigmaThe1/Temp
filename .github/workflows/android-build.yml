name: Disposable Android Build
on:
  push:
    branches: ['build/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare disposable OmniCouncil workspace
        run: |
          git clone --depth 1 --branch tmp-omnicouncil-build https://github.com/EnigmaThe1/autonomous-factory-platform.git /tmp/base
          cp -a /tmp/base/llm-council-mobile/. /tmp/omnicouncil/
          cp payload/app-build.gradle /tmp/omnicouncil/app/build.gradle
          cp payload/AndroidManifest.xml /tmp/omnicouncil/app/src/main/AndroidManifest.xml
          cp payload/MainActivity.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/MainActivity.kt
          cp payload/AppViewModel.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/AppViewModel.kt
          cp payload/AppUi.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/ui/AppUi.kt
          cp payload/AuditModelAllocationActivity.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/AuditModelAllocationActivity.kt
          cp payload/AuditModelAllocationViewModel.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/AuditModelAllocationViewModel.kt
          cp payload/RepoAuditActivity.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/RepoAuditActivity.kt
          cp payload/RepoAuditViewModel.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/RepoAuditViewModel.kt
          cp payload/RepoAuditService.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/RepoAuditService.kt
          cp payload/RepoAuditRuntime.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/RepoAuditRuntime.kt
          cp payload/SecureSettings.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/SecureSettings.kt
          cp payload/GitHubClient.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/GitHubClient.kt
          cp payload/GitHubRefsClient.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/GitHubRefsClient.kt
          cp payload/OpenRouterClient.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/OpenRouterClient.kt
          cp payload/OkHttpCompat.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/OkHttpCompat.kt
          cp payload/AuditScopeRulesStore.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/AuditScopeRulesStore.kt
          cp payload/ScopeManifestStore.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/ScopeManifestStore.kt
          cp payload/RepoAuditCheckpointStore.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/RepoAuditCheckpointStore.kt
          cp payload/RepoAuditHistoryDb.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/RepoAuditHistoryDb.kt
          cp payload/ExportManager.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/ExportManager.kt
          cp payload/ModelHealthDb.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/data/ModelHealthDb.kt
          cp payload/AuditModels.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/model/AuditModels.kt
          cp payload/ScopeValidationEngine.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/domain/ScopeValidationEngine.kt
          cp payload/RepoAuditEngine.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/domain/RepoAuditEngine.kt
          cp payload/RepositoryContentSanitizer.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/domain/RepositoryContentSanitizer.kt
          cp payload/AuditStandards.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/domain/AuditStandards.kt
          cp payload/AuditResponseValidator.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/domain/AuditResponseValidator.kt
          cp payload/ModelAuditQualifier.kt /tmp/omnicouncil/app/src/main/java/com/llmcouncil/mobile/domain/ModelAuditQualifier.kt
      - name: Build installable and release APKs
        working-directory: /tmp/omnicouncil
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify APK outputs
        run: |
          test -s /tmp/omnicouncil/app/build/outputs/apk/debug/app-debug.apk
          test -s /tmp/omnicouncil/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum /tmp/omnicouncil/app/build/outputs/apk/debug/app-debug.apk /tmp/omnicouncil/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OmniCouncil-v6.1-installable
          path: /tmp/omnicouncil/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OmniCouncil-v6.1-unsigned-release
          path: /tmp/omnicouncil/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
