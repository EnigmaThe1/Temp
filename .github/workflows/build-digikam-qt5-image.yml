name: Build digiKam Qt5 Android Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-digikam-qt5-image.yml'
      - 'qt5-toolchain/**'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/enigmathe1/digikam-android-qt515

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout build factory
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned Qt5 Android toolchain
        uses: docker/build-push-action@v6
        with:
          context: ./qt5-toolchain
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:qt5.15.5-kf5-arm64
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify published image
        run: |
          docker pull "${IMAGE_NAME}:qt5.15.5-kf5-arm64"
          docker run --rm "${IMAGE_NAME}:qt5.15.5-kf5-arm64" \
            bash -lc '/opt/nativetooling/bin/qmake -v && test -f /home/user/android-arm64-clang/craft/craftenv.sh'
