name: digiKam Android Qt5 Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'digikam-android/**'

permissions:
  contents: read
  packages: read

env:
  TOOLCHAIN_IMAGE: ghcr.io/enigmathe1/digikam-android-qt515:qt5.15.5-kf5-arm64

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout build factory
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Qt5 toolchain workspace
        id: qt5-home-cache
        uses: actions/cache/restore@v4
        with:
          path: qt5-home-cache
          key: digikam-android-qt5-home-v2-${{ runner.os }}-arm64-${{ github.run_id }}
          restore-keys: |
            digikam-android-qt5-home-v2-${{ runner.os }}-arm64-

      - name: Pull pinned Qt5/KF5 Android toolchain
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker pull "${TOOLCHAIN_IMAGE}"; then
              exit 0
            fi
            echo "Qt5 toolchain image not published yet (attempt ${attempt}/60); retrying in 30s..."
            sleep 30
          done
          echo "Pinned Qt5 toolchain image was not available after 30 minutes."
          exit 1

      - name: Seed Qt5 Craft cache from toolchain image
        shell: bash
        run: |
          if [[ ! -d qt5-home-cache/android-arm64-clang || ! -d qt5-home-cache/craft-clone || ! -d qt5-home-cache/blueprints ]]; then
            rm -rf qt5-home-cache
            cid="$(docker create "${TOOLCHAIN_IMAGE}")"
            trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
            # KDE's retired Craft tree contains absolute symlinks such as
            # android-arm64-clang/craft -> /home/user/craft-clone. Preserve
            # the complete home workspace so those links remain valid.
            docker cp "${cid}:/home/user" qt5-home-cache
            docker rm "${cid}"
            trap - EXIT
          fi
          echo "Seeded Qt5 home workspace:"
          ls -la qt5-home-cache | head -n 60
          sudo chown -R 1000:1000 qt5-home-cache
          # KDE's retired Craft tree uses absolute /home/user symlinks.
          # Validate those links only in the same container path used by the build.
          docker run --rm \
            -v "$PWD/qt5-home-cache:/home/user" \
            "${TOOLCHAIN_IMAGE}" \
            bash -lc '
              set -eux
              test -d /home/user/android-arm64-clang
              test -d /home/user/craft-clone
              test -d /home/user/blueprints
              test -f /home/user/android-arm64-clang/craft/craftenv.sh
            '

      - name: Build digiKam 9.1.0 Android arm64 APK
        shell: bash
        run: |
          mkdir -p digikam-android-out .digikam-android-work
          chmod 0777 digikam-android-out .digikam-android-work

          set +e
          docker run --rm \
            -e CRAFT_ROOT=/home/user/android-arm64-clang \
            -e DIGIKAM_SKIP_CRAFT_REFRESH=1 \
            -v "$PWD:/workspace" \
            -v "$PWD/qt5-home-cache:/home/user" \
            "${TOOLCHAIN_IMAGE}" \
            bash -lc 'test -f /home/user/android-arm64-clang/craft/craftenv.sh && bash /workspace/digikam-android/build.sh'
          rc=$?
          set -e

          echo "$rc" > digikam-android-out/docker-exit-code.txt
          exit 0

      - name: Upload APKs and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digikam-9.1.0-android-qt5-arm64
          path: digikam-android-out/
          if-no-files-found: warn
          retention-days: 7

      - name: Hand Qt5 workspace back to runner
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" qt5-home-cache || true
          sudo chmod -R u+rwX qt5-home-cache || true

      - name: Save Qt5 toolchain workspace
        if: always()
        uses: actions/cache/save@v4
        with:
          path: qt5-home-cache
          key: ${{ steps.qt5-home-cache.outputs.cache-primary-key }}

      - name: Fail workflow if Android build failed
        shell: bash
        run: |
          rc="$(cat digikam-android-out/docker-exit-code.txt 2>/dev/null || echo 99)"
          echo "Container build exit code: $rc"
          if [[ "$rc" != "0" ]]; then
            exit "$rc"
          fi
          test -f digikam-android-out/build-status.txt
          grep -qx 'SUCCESS' digikam-android-out/build-status.txt
